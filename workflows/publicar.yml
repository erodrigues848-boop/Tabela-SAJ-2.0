name: Atualizar notícias e publicar Tabela SAJ

on:
  push:
    branches: [main]
  schedule:
    # 10:17 UTC = 07:17, horário de Brasília (UTC-3)
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Executar testes locais
        run: python -m unittest discover -s tests -v
      - name: Atualizar manchetes (com contingência)
        run: python scripts/collect_news.py --allow-empty
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Enviar site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4
